<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 365.89" width="780" height="365.89" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="34" font-size="16" fill="#202124" font-weight="700" text-anchor="start">O sub-painel que virou círculo</text><circle cx="200" cy="196.94" r="127.94" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 5"/><rect x="149.6" y="79.34" width="100.8" height="235.2" fill="#d9bf96" fill-opacity="0.5" stroke="#d62828" stroke-width="2.5"/><circle cx="149.6" cy="79.34" r="4" fill="#202124"/><circle cx="149.6" cy="314.54" r="4" fill="#202124"/><circle cx="250.4" cy="79.34" r="4" fill="#202124"/><circle cx="250.4" cy="314.54" r="4" fill="#202124"/><line x1="200" y1="196.94" x2="250.4" y2="79.34" stroke="#202124" stroke-width="1" stroke-dasharray="3 3" fill="none"/><text x="410" y="126.94" font-size="13" fill="#d62828" font-weight="700" text-anchor="start">desenhado: BSP 240 x 560, cantos R3</text><text x="410" y="146.94" font-size="13" fill="#5f6368" font-weight="700" text-anchor="start">o que foi pro DXF: círculo de raio ~305</text><text x="410" y="186.94" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">O detector de círculo media a distância</text><text x="410" y="204.94" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">dos pontos ao centro, com 1% de folga.</text><text x="410" y="222.94" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">Retângulo de canto curto só tem pontos</text><text x="410" y="240.94" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">nos quatro cantos, todos à meia diagonal:</text><text x="410" y="258.94" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">passou no teste.</text></svg>