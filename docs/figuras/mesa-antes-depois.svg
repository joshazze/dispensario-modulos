<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 898.8 714.4" width="898.8" height="714.4" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="34" font-size="16" fill="#202124" font-weight="700" text-anchor="start">Antes: painéis de 1500 mm de altura</text><rect x="30" y="70" width="276" height="240" fill="#f1f3f4" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="30" y="70" width="240" height="240" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" opacity="0.9"/><rect x="30" y="70" width="360" height="302.4" fill="#d62828" fill-opacity="0.06" stroke="#d62828" stroke-width="2" stroke-dasharray="8 5"/><text x="210" y="360.4" font-size="12" fill="#d62828" font-weight="700" text-anchor="middle">frente do armário 1500 x 1260</text><rect x="30" y="396.4" width="360" height="60" fill="#d62828" fill-opacity="0.06" stroke="#d62828" stroke-width="2" stroke-dasharray="8 5"/><text x="210" y="430.4" font-size="12" fill="#d62828" font-weight="700" text-anchor="middle">lateral do biométrico 1500 x 250</text><text x="30" y="480.4" font-size="13" fill="#d62828" font-weight="600" text-anchor="start">nenhum dos dois entra na mesa sem emenda</text><text x="464.4" y="34" font-size="16" fill="#202124" font-weight="700" text-anchor="start">Depois: 1000 mm de altura</text><rect x="464.4" y="70" width="276" height="240" fill="#f1f3f4" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="464.4" y="70" width="240" height="240" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" opacity="0.9"/><rect x="464.4" y="70" width="240" height="180" fill="#d9bf96" fill-opacity="0.6" stroke="#202124" stroke-width="1.5"/><text x="584.4" y="164" font-size="12" fill="#202124" font-weight="700" text-anchor="middle">frente do armário 1000 x 750</text><rect x="464.4" y="396.4" width="276" height="240" fill="#f1f3f4" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="464.4" y="396.4" width="240" height="240" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1" opacity="0.9"/><rect x="464.4" y="396.4" width="240" height="60" fill="#d9bf96" fill-opacity="0.6" stroke="#202124" stroke-width="1.5"/><text x="584.4" y="430.4" font-size="12" fill="#202124" font-weight="700" text-anchor="middle">lateral do biométrico 1000 x 250</text><text x="464.4" y="660.4" font-size="13" fill="#1a73e8" font-weight="600" text-anchor="start">cada painel cabe numa carga, deitado</text><rect x="30" y="683.4" width="14" height="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="52" y="694.4" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">carga de 1000 x 1000 (o que vai pra máquina de uma vez)</text><rect x="400" y="683.4" width="14" height="14" fill="#f1f3f4" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="422" y="694.4" font-size="12" fill="#5f6368" font-weight="400" text-anchor="start">mesa de 1150 x 1000 da eCNC L-1210</text></svg>