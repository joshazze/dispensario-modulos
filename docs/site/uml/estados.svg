<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Máquina de estados da porta"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f1a14"/></marker><marker id="aberta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1f1a14" stroke-width="1.4"/></marker><marker id="heranca" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#fffdf9" stroke="#1f1a14" stroke-width="1.2"/></marker><marker id="losango" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse"><path d="M0,5 L8,0 L16,5 L8,10 z" fill="#1f1a14"/></marker></defs><rect width="1180" height="600" fill="#fffdf9"/><rect x="35" y="102" width="230" height="76" rx="22" fill="#f1e3d3" stroke="#1f1a14" stroke-width="1.6"/><text x="150" y="134" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E1 · Bloqueado</text><text x="150" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">trava fechada</text><rect x="335" y="102" width="230" height="76" rx="22" fill="#f1e3d3" stroke="#1f1a14" stroke-width="1.6"/><text x="450" y="134" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E2 · Autenticando</text><text x="450" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">digital, ID+senha ou crachá</text><rect x="635" y="102" width="230" height="76" rx="22" fill="#dfeedd" stroke="#1f1a14" stroke-width="1.6"/><text x="750" y="134" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E3 · Autorizado</text><text x="750" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">evento criado</text><rect x="925" y="102" width="230" height="76" rx="22" fill="#dfeedd" stroke="#1f1a14" stroke-width="1.6"/><text x="1040" y="134" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E4 · Destravado</text><text x="1040" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">espera abrir (60 s)</text><rect x="925" y="292" width="230" height="76" rx="22" fill="#dfeedd" stroke="#1f1a14" stroke-width="1.6"/><text x="1040" y="324" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E5 · Porta aberta</text><text x="1040" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">conta 5 min</text><rect x="635" y="292" width="230" height="76" rx="22" fill="#f6dcd8" stroke="#1f1a14" stroke-width="1.6"/><text x="750" y="324" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E6 · Alerta</text><text x="750" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">bipe + vermelho piscando</text><rect x="335" y="292" width="230" height="76" rx="22" fill="#f1e3d3" stroke="#1f1a14" stroke-width="1.6"/><text x="450" y="324" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E7 · Fechando</text><text x="450" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">trava volta</text><rect x="35" y="292" width="230" height="76" rx="22" fill="#f6dcd8" stroke="#1f1a14" stroke-width="1.6"/><text x="150" y="324" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E8 · Falha</text><text x="150" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">sensor, leitor, relógio, rede</text><rect x="35" y="472" width="230" height="76" rx="22" fill="#f6dcd8" stroke="#1f1a14" stroke-width="1.6"/><text x="150" y="504" font-size="16" text-anchor="middle" font-weight="700" fill="#1f1a14">E9 · Violação</text><text x="150" y="527" font-size="13" text-anchor="middle" font-weight="400" fill="#6b6257">aberta sem autorização</text><circle cx="150" cy="40" r="10" fill="#1f1a14"/><path d="M150,50 L150,101" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="205" y="82" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">liga / reinicia</text><path d="M265,128 L334,128" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="300" y="120" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">credencial</text><path d="M335,154 L266,154" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="300" y="172" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">negada</text><path d="M565,140 L634,140" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="600" y="132" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">válida</text><path d="M865,140 L924,140" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="895" y="132" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">pulso</text><path d="M1040,101 L1040,66 L230,66 L230,101" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="640" y="58" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">60 s sem abrir: trava de novo</text><path d="M1040,178 L1040,291" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="1072" y="240" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">abriu</text><path d="M925,330 L866,330" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="895" y="322" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">5 min</text><path d="M635,330 L566,330" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="600" y="322" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">fechou</text><path d="M1040,368 L1040,412 L450,412 L450,369" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="745" y="430" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">fechou antes de 5 min</text><path d="M380,292 L235,179" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="330" y="225" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">trava</text><path d="M150,292 L150,179" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="108" y="240" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">recuperou</text><path d="M35,150 L14,150 L14,510 L34,510" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="0" y="0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic"></text><text x="22" y="450" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b6257" font-style="italic">porta abre sem credencial</text><path d="M265,500 L400,369" fill="none" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#seta)"/><text x="355" y="450" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b6257" font-style="italic">fechou</text><text x="760" y="520" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b6257">Qualquer estado vai para E8 quando um periférico falha.</text><text x="760" y="540" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b6257">Depois de reiniciar, o sistema sempre começa em E1 e confere os sensores.</text></svg>